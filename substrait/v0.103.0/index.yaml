# Substrait v0.103.0 -- file manifest.
#
# One of these exists per release named in `compatibility_matrix` in
# ../../substrait-compat.yaml. A matrix entry with no manifest directory here is
# an error: the matrix would be claiming compatibility with a release whose
# bytes nobody pinned.
#
# Why this file exists. The Substrait project publishes releases and moves tags,
# and does not itself provide per-file content hashes that a downstream consumer
# can pin against. So the discipline has to live on this side. Every file the
# function and type catalogs rely on is listed below with the URL it came from,
# the commit that URL is pinned to, and the sha256 of its content. A consumer
# vendors the bytes and verifies them against this manifest; nothing downstream
# should ever trust a tag, a release tarball checksum, or "whatever is in the
# vendor directory".
#
# Deliberately NOT a gate: the GitHub release tarball checksum. GitHub's
# auto-generated archives are not byte-stable over time -- the compression
# settings have changed at least once -- so an archive hash that stops matching
# tells you nothing. Per-file hashes of the extracted content are stable.
#
# What lives where. _meta pins metadata and nothing else: this manifest holds
# paths, upstream URLs, a commit, and content hashes, and _meta never vendors a
# byte of Substrait. Vendoring the actual files is a consumer's job, done once
# per release the consumer targets, and the consumer verifies its tree against
# this manifest. That keeps the substrate small and keeps one authoritative
# statement of what a release contains, instead of N copies of the bytes drifting
# apart in N repositories.
#
# This manifest is machine-readable so the codegen paranoia can consume it if it
# wants to fold the substrate's Substrait pin into its own hash chain. Whether
# or not it does, the manifest must agree with the central registries as a
# matter of course: every extension file referenced by a `substrait: { ext }`
# tag in function-catalog.yaml, and every extension backing a type-catalog
# mapping, has to appear below. `check_substrait_compat.py` enforces that
# direction, so an entry pointing at an extension nobody pinned fails loudly
# rather than resolving against whatever happens to be on disk.

release: v0.103.0
commit: f3667cc01f8d37236fad4b0e28981bcaf4f21a48
source: https://github.com/substrait-io/substrait
license: Apache-2.0
